openapi: 3.0.3
info:
  title: Interoperability APIs - Authz
  x-logo:
    url: './dci-logo.png'
    backgroundColor: '#FFFFFF'
    altText: 'Digital Convergence Initiative'    
  description: Provide access_token to registered clients/services. Issue OAuth2 compliant authorization token.
  version: 1.0.0
  contact:
    name: DCI Social Protection
    email: info@spdci.org
  license:
   name: DCI Social Protection License
   url: https://github.com/spdci/standards/blob/draft/LICENSE.md
servers:
  - url: "https://sandbox.spdci.org/namespace/v1.0.0"
    description: Sandbox Server
paths:
 /oauth2/client/token:
  post: 
    summary: "AUTHZ-TOKN : /oauth2/client/token"
    description: "<br>
      <b>Client integration notes: </b><br>
       1. This end point is in compliance with OAuth2 RFC 6749 to authenticate registered confidential clients with grant_type=client_credentials over HTTPS channel. <br>
       2. Clients MUST obtain client credentials (client_id with client_secret, or a registered key pair) as part of client registration. <br>
       3. Clients authenticate with ONE of the following methods; implementations MUST support at least one and SHOULD document which they support: <br>
          a. client_secret_basic: HTTP Basic with client_id / client_secret (RFC 6749 section 2.3.1). <br>
          b. client_secret_post: client_id and client_secret in the request body (RFC 6749 section 2.3.1). <br>
          c. private_key_jwt: client_assertion_type and client_assertion in the request body (RFC 7523). <br>
          d. tls_client_auth: mutual TLS client certificate (RFC 8705), with client_id in the request body. <br>
          e. Bearer token in the Authorization header, for implementations that already issue a registration or bootstrap token. <br>
       4. Clients MUST ensure to secure sensitive information e.g, client_secret, private keys, access_token, etc., <br>
       5. RFC 6749 section 4.4.3 recommends NO support for refresh access_token. <br>
       6. Successfully authenticated clients SHALL receive bearer type access_token. <br>
       7. Clients MUST set HTTP \"Authorization: Bearer <access_token>\" in HTTP header to access any spdci compliant api end points.<br>
       8. Rest end points SHALL return <b>http status 401</b> when access_token is invalid or expired.<br>"
    operationId: post_oauth2_client_token
    parameters:
      - $ref: "#/components/parameters/accept-language"
      - $ref: "#/components/parameters/timestamp"
      - $ref: "#/components/parameters/message_id_hdr"
    requestBody:
      description: ""
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/OAuth2ClientTokenRequest"
    responses:
      '200': 
        description: "Acknowledgement of message received after successful validation of message and signature"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2ClientTokenResponse"
      '400':
        $ref: "#/components/responses/OAuth2ErrorResponse"
      '401':
        $ref: "#/components/responses/OAuth2ErrorResponse"
      '404':
        $ref: "#/components/responses/HttpErrorResponse"
      '500':
        $ref: "#/components/responses/HttpErrorResponse"
    security:
      - ClientBasicAuth: [ ]
      - Authorization: [ ]
      - { }
    deprecated: false
components:
  schemas:
    OAuth2ClientTokenRequest:
      $ref: schema/core/OAuth2ClientTokenRequest.yaml
    OAuth2ClientTokenResponse:
      $ref: schema/core/OAuth2ClientTokenResponse.yaml
    OidcScope:
      $ref: schema/core/OidcScope.yaml
    OAuth2ErrorResponse:
      $ref: schema/core/OAuth2ErrorResponse.yaml
  parameters:
    accept-language:
      $ref: "../common/parameter/accept-language.yaml"
    timestamp:
      $ref: "../common/parameter/timestamp.yaml"
    message_id_hdr:
      $ref: "../common/parameter/message_id_hdr.yaml"
  responses:
    HttpErrorResponse:
      $ref: "../common/response/HttpErrorResponse.yaml"
    OAuth2ErrorResponse:
      description: "OAuth2 error response (RFC 6749 Section 5.2). 400 for invalid_request, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope; 401 for invalid_client."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuth2ErrorResponse"
  securitySchemes:
    Authorization:
      $ref: "../common/security/Authorization.yaml"
    ClientBasicAuth:
      $ref: "../common/security/ClientBasicAuth.yaml"
  